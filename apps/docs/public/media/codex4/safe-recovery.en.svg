<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680" role="img" aria-labelledby="recovery-title recovery-desc">
  <title id="recovery-title">Diagram: safe automatic recovery after a task is interrupted</title>
  <desc id="recovery-desc">Not a real UI screenshot. The original message is re-run only if an interrupted run is recorded with no possible side effects logged, the old runtime process has exited, fewer than two automatic recoveries have been used, and the original message and call still allow recovery. Otherwise nothing re-runs automatically: unknown results need checking, and stopped or handled states are kept.</desc>
  <defs>
    <marker id="recovery-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8f8f8f" />
    </marker>
  </defs>
  <rect width="1080" height="680" rx="24" fill="#f9f9f9" />
  <g font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">
    <rect x="50" y="32" width="102" height="30" rx="15" fill="#e8e8e8" />
    <text x="101" y="53" font-size="17" font-weight="700" text-anchor="middle" fill="#0d0d0d">Recovery</text>
    <text x="50" y="109" font-size="32" font-weight="700" fill="#0d0d0d">After an interruption: safe to re-run?</text>
    <text x="1028" y="53" font-size="17" text-anchor="end" fill="#5d5d5d">Diagram · Not a real UI screenshot</text>

    <g fill="#ffffff" stroke="#e8e8e8" stroke-width="2">
      <rect x="50" y="155" width="300" height="173" rx="18" />
      <rect x="390" y="155" width="300" height="173" rx="18" />
      <rect x="730" y="155" width="300" height="173" rx="18" />
    </g>
    <g font-size="22" font-weight="700" fill="#0d0d0d">
      <text x="74" y="201">1 · Run interrupted</text>
      <text x="414" y="201">2 · Old process gone</text>
      <text x="754" y="201">3 · Under 2 retries</text>
    </g>
    <g font-size="18" fill="#5d5d5d">
      <text x="74" y="245">No side-effect steps logged</text>
      <text x="74" y="284">Unknown tools count as risky</text>
      <text x="414" y="245">No old runtime still running</text>
      <text x="414" y="284">Never runs a task twice</text>
      <text x="754" y="245">Counted per original message</text>
      <text x="754" y="284">At most 2 automatic retries</text>
    </g>
    <g fill="none" stroke="#8f8f8f" stroke-width="2.5">
      <path d="M 200 329 V 348 H 880 V 329" />
      <path d="M 540 329 V 356" marker-end="url(#recovery-arrow)" />
    </g>
    <rect x="50" y="366" width="980" height="75" rx="16" fill="#f3f3f3" />
    <text x="74" y="410" font-size="20" font-weight="700" fill="#0d0d0d">4 · Message and call still valid: not unsent, stopped, collapsed or settled</text>
    <g fill="none" stroke="#8f8f8f" stroke-width="2.5" marker-end="url(#recovery-arrow)">
      <path d="M 540 441 V 466 H 283 V 492" />
      <path d="M 540 466 H 797 V 492" />
    </g>

    <rect x="50" y="501" width="466" height="122" rx="18" fill="#e6f0fa" />
    <rect x="564" y="501" width="466" height="122" rx="18" fill="#fff5e7" />
    <text x="74" y="540" font-size="24" font-weight="700" fill="#0d0d0d">All met → re-run the message</text>
    <text x="74" y="580" font-size="18" fill="#5d5d5d">Runs after reconnect, labeled recovery N/2</text>
    <text x="588" y="540" font-size="24" font-weight="700" fill="#b26b00">Not met → no automatic re-run</text>
    <text x="588" y="580" font-size="18" fill="#805000">Check unknown results; keep stopped/handled</text>
    <text x="50" y="657" font-size="18" fill="#5d5d5d">A conservative check from observed tool calls, not a guarantee about hidden side effects; not a worktree handoff.</text>
  </g>
</svg>
