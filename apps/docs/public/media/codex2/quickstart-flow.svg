<svg
  xmlns="http://www.w3.org/2000/svg"
  width="760"
  height="880"
  viewBox="0 0 760 880"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">第一个 Agent 任务：四步操作示意</title>
  <desc id="desc">
    启动 Hive Server，在本机打开演示房间，手动完成下一步接入一个只读
    Agent，再发送定向消息并查看回复。示意图不是实际界面截图。
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5d5d5d" />
    </marker>
  </defs>
  <rect width="760" height="880" rx="24" fill="#f9f9f9" />
  <g
    font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"
    fill="#0d0d0d"
  >
    <text x="38" y="58" font-size="32" font-weight="700">从启动到第一条回复</text>
    <text x="38" y="98" font-size="24" fill="#5d5d5d">原创流程示意 · 非实际界面截图</text>
    <rect
      x="38"
      y="128"
      width="684"
      height="132"
      rx="16"
      fill="#ffffff"
      stroke="#e8e8e8"
      stroke-width="2"
    />
    <circle cx="80" cy="170" r="24" fill="#0d0d0d" />
    <text x="80" y="179" font-size="26" text-anchor="middle" fill="#ffffff">1</text>
    <text x="120" y="179" font-size="28" font-weight="700">启动 Hive Server</text>
    <text x="64" y="223" font-size="25">npx superhive</text>
    <path
      d="M 380 270 V 296"
      fill="none"
      stroke="#5d5d5d"
      stroke-width="3"
      marker-end="url(#arrow)"
    />
    <rect
      x="38"
      y="308"
      width="684"
      height="132"
      rx="16"
      fill="#ffffff"
      stroke="#e8e8e8"
      stroke-width="2"
    />
    <circle cx="80" cy="350" r="24" fill="#0d0d0d" />
    <text x="80" y="359" font-size="26" text-anchor="middle" fill="#ffffff">2</text>
    <text x="120" y="359" font-size="28" font-weight="700">打开网页，准备演示房间</text>
    <text x="64" y="403" font-size="25">本机房主登录 · 暂不挂真实项目目录</text>
    <path
      d="M 380 450 V 476"
      fill="none"
      stroke="#5d5d5d"
      stroke-width="3"
      marker-end="url(#arrow)"
    />
    <rect
      x="38"
      y="488"
      width="684"
      height="132"
      rx="16"
      fill="#e6f0fa"
      stroke="#93bde5"
      stroke-width="2"
    />
    <circle cx="80" cy="530" r="24" fill="#0d0d0d" />
    <text x="80" y="539" font-size="26" text-anchor="middle" fill="#ffffff">3</text>
    <text x="120" y="539" font-size="28" font-weight="700">接入 1 个只读 Agent</text>
    <text x="64" y="583" font-size="25">选 Runtime → 下一步 → 只读 → 下一步</text>
    <path
      d="M 380 630 V 656"
      fill="none"
      stroke="#5d5d5d"
      stroke-width="3"
      marker-end="url(#arrow)"
    />
    <rect
      x="38"
      y="668"
      width="684"
      height="132"
      rx="16"
      fill="#e8f5ef"
      stroke="#94c5b1"
      stroke-width="2"
    />
    <circle cx="80" cy="710" r="24" fill="#23634d" />
    <text x="80" y="719" font-size="26" text-anchor="middle" fill="#ffffff">4</text>
    <text x="120" y="719" font-size="28" font-weight="700">发送定向消息，查看回复</text>
    <text x="64" y="763" font-size="25">@guide-agent 请只回复“已连接”</text>
    <text x="38" y="846" font-size="24" fill="#5d5d5d">
      示例名为虚构；上线与权限能力需分别核对。
    </text>
  </g>
</svg>
