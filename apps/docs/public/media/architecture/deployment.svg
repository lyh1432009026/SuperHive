<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
  <title id="title">Hive 服务部署模型</title><desc id="desc">浏览器和 IM 经局域网、VPN或HTTPS代理访问Hive。Agent在各自设备通过Bridge接入，项目文件与私有会话保留在本机。原理示意，非截图。</desc>
  <rect width="900" height="410" rx="18" fill="#f3f3f3"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <g fill="#fff" stroke="#e8e8e8"><rect x="30" y="75" width="220" height="90" rx="12"/><rect x="30" y="225" width="220" height="90" rx="12"/><rect x="350" y="150" width="200" height="105" rx="12"/><rect x="650" y="70" width="220" height="95" rx="12"/><rect x="650" y="225" width="220" height="95" rx="12"/></g>
    <g fill="#0d0d0d" font-size="22" font-weight="600"><text x="140" y="111">浏览器 / 手机</text><text x="140" y="261">局域网 / VPN / HTTPS</text><text x="450" y="189">Hive Server</text><text x="760" y="107">Agent Bridge</text><text x="760" y="264">本机工作区</text></g>
    <g fill="#5d5d5d" font-size="15"><text x="140" y="140">讨论 · 派活 · 作答</text><text x="140" y="290">保留来源与身份校验</text><text x="450" y="221">公共数据 · 路由 · 授权</text><text x="760" y="138">Provider 与命令在本机</text><text x="760" y="295">文件 · 私有会话 · 权限</text></g>
    <g fill="none" stroke="#0d0d0d" stroke-width="3"><path d="M140 165v60M250 271h52V202h48M550 202h50V117h50M760 165v60"/></g>
    <text x="450" y="365" fill="#5d5d5d" font-size="15">Server 负责共享协作；不自动拥有其他设备的文件与管理权限。</text>
    <text x="450" y="394" fill="#5d5d5d" font-size="12">部署原理示意 · 非实际界面截图</text>
  </g>
</svg>
