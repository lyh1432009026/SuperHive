<svg
  xmlns="http://www.w3.org/2000/svg"
  width="840"
  height="780"
  viewBox="0 0 840 780"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Send, Steer and attachments flow</title>
  <desc id="desc">
    A message explicitly mentions its recipient. A normal Send goes to the task queue; supported running tasks can be Steered to add to the current task. Attachments must finish uploading before they're sent with the message. Steering can't undo side effects that already happened. Diagram, not a real UI screenshot.
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5d5d5d" />
    </marker>
  </defs>
  <rect width="840" height="780" rx="24" fill="#f9f9f9" />
  <g
    font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"
    fill="#0d0d0d"
  >
    <text x="38" y="58" font-size="32" font-weight="700">Tasks, steering and attachments</text>
    <text x="38" y="98" font-size="24" fill="#5d5d5d">Flow diagram · Not a real UI screenshot</text>
    <rect
      x="38"
      y="128"
      width="764"
      height="98"
      rx="16"
      fill="#ffffff"
      stroke="#e8e8e8"
      stroke-width="2"
    />
    <text x="420" y="168" font-size="28" font-weight="700" text-anchor="middle">
      @ the recipient and state the task scope
    </text>
    <text x="420" y="206" font-size="25" text-anchor="middle">With attachments: wait for the upload</text>
    <path
      d="M 420 236 V 254 H 224 V 278"
      fill="none"
      stroke="#5d5d5d"
      stroke-width="3"
      marker-end="url(#arrow)"
    />
    <path
      d="M 420 254 H 616 V 278"
      fill="none"
      stroke="#5d5d5d"
      stroke-width="3"
      marker-end="url(#arrow)"
    />
    <rect
      x="38"
      y="292"
      width="372"
      height="186"
      rx="16"
      fill="#e6f0fa"
      stroke="#93bde5"
      stroke-width="2"
    />
    <text x="224" y="338" font-size="29" font-weight="700" text-anchor="middle">Normal “Send”</text>
    <text x="224" y="391" font-size="26" text-anchor="middle">Joins the queue</text>
    <text x="224" y="437" font-size="24" text-anchor="middle">Won't alter a busy task</text>
    <rect
      x="430"
      y="292"
      width="372"
      height="186"
      rx="16"
      fill="#e8f5ef"
      stroke="#94c5b1"
      stroke-width="2"
    />
    <text x="616" y="338" font-size="29" font-weight="700" text-anchor="middle">
      “Steer” while running
    </text>
    <text x="616" y="391" font-size="26" text-anchor="middle">Adds to current task</text>
    <text x="616" y="437" font-size="24" text-anchor="middle">Supported targets only</text>
    <path
      d="M 224 488 V 512 H 420 V 534"
      fill="none"
      stroke="#5d5d5d"
      stroke-width="3"
      marker-end="url(#arrow)"
    />
    <path d="M 616 488 V 512 H 420" fill="none" stroke="#5d5d5d" stroke-width="3" />
    <rect
      x="38"
      y="548"
      width="764"
      height="98"
      rx="16"
      fill="#ffffff"
      stroke="#e8e8e8"
      stroke-width="2"
    />
    <text x="420" y="587" font-size="28" font-weight="700" text-anchor="middle">
      Check task details: received? result?
    </text>
    <text x="420" y="626" font-size="25" text-anchor="middle">Unsure about side effects? Verify, then retry</text>
    <rect x="38" y="672" width="764" height="74" rx="14" fill="#fff5e7" />
    <text x="420" y="703" font-size="24" text-anchor="middle">
      Steer ≠ Stop ≠ undoing actions already taken
    </text>
    <text x="420" y="733" font-size="24" text-anchor="middle">
      Upload files first; a web preview ≠ model-readable
    </text>
  </g>
</svg>
