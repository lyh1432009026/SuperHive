<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" role="img" aria-labelledby="title desc">
  <title id="title">你、团队成员与 Agent 在公共房间协作</title>
  <desc id="desc">你单独负责目标与审批，团队其他成员参与讨论和协作，Claude 与 Codex 分别分析和执行。流动连线表示任务与消息汇入共享房间，再由各自的本机工作区执行；权限与会话不共享。此图为概念示意，不是实时状态或界面截图。</desc>
  <style>
    .workroom-flow {
      fill: none;
      stroke: #0169cc;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 2 22;
    }

    @media (prefers-reduced-motion: no-preference) {
      .workroom-flow {
        animation: workroom-flow 2.4s linear infinite;
      }

      .workroom-flow-team {
        animation-delay: -0.6s;
      }

      .workroom-flow-claude {
        animation-delay: -1.2s;
      }

      .workroom-flow-codex {
        animation-delay: -1.8s;
      }

      .workroom-flow-local {
        animation-delay: -0.9s;
      }

      .workroom-activity {
        animation: workroom-activity 3.2s ease-in-out infinite;
      }
    }

    @keyframes workroom-flow {
      to {
        stroke-dashoffset: -48;
      }
    }

    @keyframes workroom-activity {
      0%, 100% {
        opacity: 0.45;
      }
      50% {
        opacity: 1;
      }
    }
  </style>
  <rect width="680" height="460" rx="24" fill="#f3f3f3"/>
  <g fill="none" stroke="#8f8f8f" stroke-width="1.5">
    <path d="M100 146v39q0 12 12 12h216q12 0 12 12v20"/>
    <path d="M260 146v39q0 12 12 12h56q12 0 12 12v20"/>
    <path d="M420 146v39q0 12-12 12h-56q-12 0-12 12v20"/>
    <path d="M580 146v39q0 12-12 12H352q-12 0-12 12v20"/>
    <path d="M235 321v42"/>
    <path d="M445 321v42"/>
  </g>
  <g aria-hidden="true">
    <path class="workroom-flow" d="M100 146v39q0 12 12 12h216q12 0 12 12v20"/>
    <path class="workroom-flow workroom-flow-team" d="M260 146v39q0 12 12 12h56q12 0 12 12v20"/>
    <path class="workroom-flow workroom-flow-claude" d="M420 146v39q0 12-12 12h-56q-12 0-12 12v20"/>
    <path class="workroom-flow workroom-flow-codex" d="M580 146v39q0 12-12 12H352q-12 0-12 12v20"/>
    <path class="workroom-flow workroom-flow-local" d="M235 321v42"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="100" y="38" font-size="12" font-weight="600" fill="#0d0d0d">由你发起</text>
    <path d="M190 33h182m96 0h182" fill="none" stroke="#e8e8e8"/>
    <text x="420" y="38" font-size="12" fill="#5d5d5d">一起协作</text>
    <rect x="28" y="54" width="144" height="92" rx="14" fill="#0d0d0d"/>
    <g fill="#fff" stroke="#e8e8e8">
      <rect x="188" y="54" width="144" height="92" rx="14"/>
      <rect x="348" y="54" width="144" height="92" rx="14"/>
      <rect x="508" y="54" width="144" height="92" rx="14"/>
    </g>
    <text x="100" y="93" font-size="22" font-weight="600" fill="#fff">你</text>
    <g font-size="20" font-weight="600" fill="#0d0d0d">
      <text x="260" y="93">其他成员</text>
      <text x="420" y="93">Claude</text>
      <text x="580" y="93">Codex</text>
    </g>
    <text x="100" y="121" font-size="13" fill="#ececec">决定目标 · 作答审批</text>
    <g font-size="13" fill="#5d5d5d">
      <text x="260" y="121">讨论 · 认领 · 协作</text>
      <text x="420" y="121">分析 · 讨论 · 委派</text>
      <text x="580" y="121">编码 · 验证 · 交付</text>
    </g>
    <text x="450" y="218" font-size="12" fill="#5d5d5d">任务与消息流转</text>
    <rect x="135" y="229" width="410" height="92" rx="16" fill="#0d0d0d"/>
    <circle class="workroom-activity" cx="165" cy="257" r="4" fill="#48aaff" aria-hidden="true"/>
    <text x="340" y="267" font-size="23" font-weight="600" fill="#fff">同一间 SuperHive 房间</text><text x="340" y="295" font-size="15" fill="#ececec">公共消息 · 协作白板 · 可见的任务状态</text>
    <g fill="#fff" stroke="#e8e8e8"><rect x="135" y="363" width="200" height="56" rx="12"/><rect x="345" y="363" width="200" height="56" rx="12"/></g>
    <g font-size="16" fill="#0d0d0d"><text x="235" y="398">各自的本机工作区</text><text x="445" y="398">各自的权限与会话</text></g>
    <text x="340" y="445" font-size="12" fill="#5d5d5d">协作模型示意 · 非实时状态 · 非产品截图</text>
  </g>
</svg>
