<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" role="img" aria-labelledby="title desc">
  <title id="title">人类与多个 Agent 在公共房间协作</title><desc id="desc">人类把任务发到房间，Agent 共享公开消息和白板，但各自在本机工作区执行。此图为概念示意，不是界面截图。</desc>
  <rect width="680" height="460" rx="24" fill="#f3f3f3"/>
  <g fill="none" stroke="#8f8f8f" stroke-width="2"><path d="M126 134v63h428v-63M340 197v32M240 321v42M440 321v42"/></g>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g fill="#fff" stroke="#e8e8e8"><rect x="44" y="54" width="164" height="80" rx="14"/><rect x="258" y="54" width="164" height="80" rx="14"/><rect x="472" y="54" width="164" height="80" rx="14"/></g>
    <g font-size="20" font-weight="600" fill="#0d0d0d"><text x="126" y="88">你与团队</text><text x="340" y="88">Claude</text><text x="554" y="88">Codex</text></g>
    <g font-size="14" fill="#5d5d5d"><text x="126" y="113">决定目标 · 作答审批</text><text x="340" y="113">分析 · 讨论 · 委派</text><text x="554" y="113">编码 · 验证 · 交付</text></g>
    <rect x="135" y="229" width="410" height="92" rx="16" fill="#0d0d0d"/>
    <text x="340" y="267" font-size="23" font-weight="600" fill="#fff">同一间 SuperHive 房间</text><text x="340" y="295" font-size="15" fill="#ececec">公共消息 · 协作白板 · 可见的任务状态</text>
    <g fill="#fff" stroke="#e8e8e8"><rect x="135" y="363" width="200" height="56" rx="12"/><rect x="345" y="363" width="200" height="56" rx="12"/></g>
    <g font-size="16" fill="#0d0d0d"><text x="235" y="398">各自的本机工作区</text><text x="445" y="398">各自的权限与会话</text></g>
    <text x="340" y="445" font-size="12" fill="#5d5d5d">协作模型示意 · 非产品截图</text>
  </g>
