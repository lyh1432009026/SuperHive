<svg
  xmlns="http://www.w3.org/2000/svg"
  width="760"
  height="880"
  viewBox="0 0 760 880"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Your first Agent task in four steps</title>
  <desc id="desc">
    Start Hive Server, open a demo room on this machine, click Next manually to add a Read-only
    Agent, then send a targeted message and read the reply. Diagram, not a real UI screenshot.
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5d5d5d" />
    </marker>
  </defs>
  <rect width="760" height="880" rx="24" fill="#f9f9f9" />
  <g
    font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"
    fill="#0d0d0d"
  >
    <text x="38" y="58" font-size="32" font-weight="700">From launch to first reply</text>
    <text x="38" y="98" font-size="24" fill="#5d5d5d">Flow diagram · Not a real UI screenshot</text>
    <rect
      x="38"
      y="128"
      width="684"
      height="132"
      rx="16"
      fill="#ffffff"
      stroke="#e8e8e8"
      stroke-width="2"
    />
    <circle cx="80" cy="170" r="24" fill="#0d0d0d" />
    <text x="80" y="179" font-size="26" text-anchor="middle" fill="#ffffff">1</text>
    <text x="120" y="179" font-size="28" font-weight="700">Start Hive Server</text>
    <text x="64" y="223" font-size="25">npm i -g superhive → hive</text>
    <path
      d="M 380 270 V 296"
      fill="none"
      stroke="#5d5d5d"
      stroke-width="3"
      marker-end="url(#arrow)"
    />
    <rect
      x="38"
      y="308"
      width="684"
      height="132"
      rx="16"
      fill="#ffffff"
      stroke="#e8e8e8"
      stroke-width="2"
    />
    <circle cx="80" cy="350" r="24" fill="#0d0d0d" />
    <text x="80" y="359" font-size="26" text-anchor="middle" fill="#ffffff">2</text>
    <text x="120" y="359" font-size="28" font-weight="700">Open the web UI, set up a demo room</text>
    <text x="64" y="403" font-size="25">Local owner sign-in · no real project yet</text>
    <path
      d="M 380 450 V 476"
      fill="none"
      stroke="#5d5d5d"
      stroke-width="3"
      marker-end="url(#arrow)"
    />
    <rect
      x="38"
      y="488"
      width="684"
      height="132"
      rx="16"
      fill="#e6f0fa"
      stroke="#93bde5"
      stroke-width="2"
    />
    <circle cx="80" cy="530" r="24" fill="#0d0d0d" />
    <text x="80" y="539" font-size="26" text-anchor="middle" fill="#ffffff">3</text>
    <text x="120" y="539" font-size="28" font-weight="700">Add 1 Read-only Agent</text>
    <text x="64" y="583" font-size="25">Pick Runtime → Next → Read-only → Next</text>
    <path
      d="M 380 630 V 656"
      fill="none"
      stroke="#5d5d5d"
      stroke-width="3"
      marker-end="url(#arrow)"
    />
    <rect
      x="38"
      y="668"
      width="684"
      height="132"
      rx="16"
      fill="#e8f5ef"
      stroke="#94c5b1"
      stroke-width="2"
    />
    <circle cx="80" cy="710" r="24" fill="#23634d" />
    <text x="80" y="719" font-size="26" text-anchor="middle" fill="#ffffff">4</text>
    <text x="120" y="719" font-size="28" font-weight="700">@mention it, check the reply</text>
    <text x="64" y="763" font-size="25">@guide-agent Reply only “Connected”</text>
    <text x="38" y="846" font-size="22" fill="#5d5d5d">
      Names are fictional; check availability and permissions.
    </text>
  </g>
</svg>
