<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SuperHive · 多人 Agent 协作空间</title>
    <script src="/boot-theme.js"></script>
    <!-- 首屏加载占位：蜂巢 logo 描边画出、点亮中心、信号往外扩散（和桌面端启动动画同一套）。
         纯 CSS + 内联 SVG，不等脚本；网页画好后由 src/boot-splash.ts 淡出移除。桌面端由窗口自己盖加载层，这里藏起来。 -->
    <style>
      #boot-splash {
        --bs-bg: #ffffff;
        --bs-g1: #0169cc;
        --bs-g2: #b86e00;
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: var(--bs-bg);
        transition: opacity 0.36s ease;
      }
      :root[data-theme="dark"] #boot-splash {
        --bs-bg: #212121;
        --bs-g1: #48aaff;
        --bs-g2: #ffc46b;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #boot-splash {
          --bs-bg: #212121;
          --bs-g1: #48aaff;
          --bs-g2: #ffc46b;
        }
      }
      :root[data-desktop] #boot-splash {
        display: none;
      }
      #boot-splash svg {
        width: 88px;
        height: 88px;
        overflow: visible;
        margin-top: -4vh;
        /* 加载很快时一闪而过不好看：稍等一下再出现 */
        animation: bs-in 0.3s ease 0.15s both;
        transition: transform 0.36s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #boot-splash.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash.is-leaving svg {
        transform: scale(0.72);
      }
      #boot-splash .s1 {
        stop-color: var(--bs-g1);
      }
      #boot-splash .s2 {
        stop-color: var(--bs-g2);
      }
      #boot-splash .line {
        fill: none;
        stroke: url(#bs-g);
        stroke-width: 2.6;
        stroke-linejoin: round;
        stroke-linecap: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: bs-draw 0.95s cubic-bezier(0.65, 0, 0.35, 1) 0.2s forwards;
      }
      #boot-splash .inner {
        opacity: 0.5;
        stroke-dashoffset: -100;
        animation-delay: 0.5s;
      }
      #boot-splash .dot,
      #boot-splash .ring {
        transform-box: fill-box;
        transform-origin: center;
      }
      #boot-splash .dot {
        fill: url(#bs-g);
        transform: scale(0);
        animation: bs-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 1.1s forwards;
      }
      #boot-splash .ring {
        fill: none;
        stroke: var(--bs-g1);
        stroke-width: 1.3;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
        opacity: 0;
        animation: bs-ring 2.2s cubic-bezier(0.2, 0.6, 0.35, 1) 1.4s infinite;
      }
      @keyframes bs-in {
        from {
          opacity: 0;
        }
      }
      @keyframes bs-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes bs-pop {
        to {
          transform: scale(1);
        }
      }
      @keyframes bs-ring {
        0% {
          opacity: 0.7;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(9);
        }
      }
      @keyframes bs-breathe {
        from {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash svg {
          animation: bs-breathe 1.6s ease-in-out infinite alternate;
        }
        #boot-splash .line,
        #boot-splash .dot {
          animation: none;
          stroke-dashoffset: 0;
          transform: none;
        }
        #boot-splash .ring {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <svg viewBox="0 0 48 48">
        <defs>
          <linearGradient id="bs-g" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
            <stop class="s1" offset="0" />
            <stop class="s2" offset="1" />
          </linearGradient>
        </defs>
        <path class="ring" d="M24 20.6L26.94 22.3L26.94 25.7L24 27.4L21.06 25.7L21.06 22.3Z" />
        <path class="line" pathLength="100" d="m24 3 18 10.5v21L24 45 6 34.5v-21L24 3Z" />
        <path class="line inner" pathLength="100" d="m24 12 10 6v12l-10 6-10-6V18l10-6Z" />
        <circle class="dot" cx="24" cy="24" r="3" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
