<svg
  xmlns="http://www.w3.org/2000/svg"
  width="840"
  height="780"
  viewBox="0 0 840 780"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">消息发送、引导与附件流程示意</title>
  <desc id="desc">
    消息明确提及接收者。普通发送进入任务队列；支持的运行中任务可以通过引导补充当前任务。附件必须先上传完成，再随消息发送。引导不能撤销已发生的副作用。示意图不是实际界面截图。
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5d5d5d" />
    </marker>
  </defs>
  <rect width="840" height="780" rx="24" fill="#f9f9f9" />
  <g
    font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"
    fill="#0d0d0d"
  >
    <text x="38" y="58" font-size="32" font-weight="700">把任务、补充和附件分清楚</text>
    <text x="38" y="98" font-size="24" fill="#5d5d5d">原创流程示意 · 非实际界面截图</text>
    <rect
      x="38"
      y="128"
      width="764"
      height="98"
      rx="16"
      fill="#ffffff"
      stroke="#e8e8e8"
      stroke-width="2"
    />
    <text x="420" y="168" font-size="28" font-weight="700" text-anchor="middle">
      明确 @ 接收者，写出任务范围
    </text>
    <text x="420" y="206" font-size="25" text-anchor="middle">有附件时：先等上传完成</text>
    <path
      d="M 420 236 V 254 H 224 V 278"
      fill="none"
      stroke="#5d5d5d"
      stroke-width="3"
      marker-end="url(#arrow)"
    />
    <path
      d="M 420 254 H 616 V 278"
      fill="none"
      stroke="#5d5d5d"
      stroke-width="3"
      marker-end="url(#arrow)"
    />
    <rect
      x="38"
      y="292"
      width="372"
      height="186"
      rx="16"
      fill="#e6f0fa"
      stroke="#93bde5"
      stroke-width="2"
    />
    <text x="224" y="338" font-size="29" font-weight="700" text-anchor="middle">普通「发送」</text>
    <text x="224" y="391" font-size="26" text-anchor="middle">进入待处理队列</text>
    <text x="224" y="437" font-size="24" text-anchor="middle">忙时不等于立即改当前任务</text>
    <rect
      x="430"
      y="292"
      width="372"
      height="186"
      rx="16"
      fill="#e8f5ef"
      stroke="#94c5b1"
      stroke-width="2"
    />
    <text x="616" y="338" font-size="29" font-weight="700" text-anchor="middle">
      运行中「引导」
    </text>
    <text x="616" y="391" font-size="26" text-anchor="middle">补充当前任务</text>
    <text x="616" y="437" font-size="24" text-anchor="middle">只在受支持的目标上提供</text>
    <path
      d="M 224 488 V 512 H 420 V 534"
      fill="none"
      stroke="#5d5d5d"
      stroke-width="3"
      marker-end="url(#arrow)"
    />
    <path d="M 616 488 V 512 H 420" fill="none" stroke="#5d5d5d" stroke-width="3" />
    <rect
      x="38"
      y="548"
      width="764"
      height="98"
      rx="16"
      fill="#ffffff"
      stroke="#e8e8e8"
      stroke-width="2"
    />
    <text x="420" y="587" font-size="28" font-weight="700" text-anchor="middle">
      查看任务详情，确认接收与结果
    </text>
    <text x="420" y="626" font-size="25" text-anchor="middle">不确定副作用时，先核对再重试</text>
    <rect x="38" y="672" width="764" height="74" rx="14" fill="#fff5e7" />
    <text x="420" y="703" font-size="24" text-anchor="middle">
      引导 ≠ 停止 ≠ 撤销已经发生的动作
    </text>
    <text x="420" y="733" font-size="24" text-anchor="middle">
      附件先上传；网页预览不保证模型一定能解析
    </text>
  </g>
</svg>
