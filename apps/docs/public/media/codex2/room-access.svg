<svg
  xmlns="http://www.w3.org/2000/svg"
  width="760"
  height="880"
  viewBox="0 0 760 880"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">房间与身份授权边界示意</title>
  <desc id="desc">
    本机房主可以管理 Hive
    所在电脑。房主设备通过五分钟有效的一次性票登录，管理电脑仍需授权。访客通过可多人使用的限时邀请，仅访问被邀请房间，调度房主
    Agent 默认待批准。示意图不是实际界面截图。
  </desc>
  <rect width="760" height="880" rx="24" fill="#f9f9f9" />
  <g
    font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"
    fill="#0d0d0d"
  >
    <text x="38" y="58" font-size="32" font-weight="700">三种入口，三种权限边界</text>
    <text x="38" y="98" font-size="24" fill="#5d5d5d">原创身份示意 · 非实际界面截图</text>
    <rect
      x="38"
      y="134"
      width="684"
      height="184"
      rx="18"
      fill="#e8f5ef"
      stroke="#94c5b1"
      stroke-width="2"
    />
    <rect x="60" y="155" width="122" height="40" rx="10" fill="#23634d" />
    <text x="121" y="184" font-size="24" text-anchor="middle" fill="#ffffff">本机房主</text>
    <text x="62" y="237" font-size="28" font-weight="700">在 Server 所在电脑打开网页</text>
    <text x="62" y="283" font-size="25">管理本机 Agent；发放邀请和设备登录票</text>
    <rect
      x="38"
      y="342"
      width="684"
      height="218"
      rx="18"
      fill="#e6f0fa"
      stroke="#93bde5"
      stroke-width="2"
    />
    <rect x="60" y="363" width="146" height="40" rx="10" fill="#0d0d0d" />
    <text x="133" y="392" font-size="24" text-anchor="middle" fill="#ffffff">房主新设备</text>
    <text x="62" y="444" font-size="28" font-weight="700">扫码或链接 → 独立设备会话</text>
    <text x="62" y="491" font-size="25">配对票：5 分钟有效、只能使用一次</text>
    <text x="62" y="534" font-size="25">登录可查看；管理 Server 电脑仍需授权</text>
    <rect
      x="38"
      y="584"
      width="684"
      height="218"
      rx="18"
      fill="#fff5e7"
      stroke="#d4b685"
      stroke-width="2"
    />
    <rect x="60" y="605" width="122" height="40" rx="10" fill="#86591d" />
    <text x="121" y="634" font-size="24" text-anchor="middle" fill="#ffffff">限时访客</text>
    <text x="62" y="687" font-size="28" font-weight="700">邀请链接 → 只访问被邀请房间</text>
    <text x="62" y="734" font-size="25">链接可多人使用；到期或撤销会失效</text>
    <text x="62" y="777" font-size="25">调度房主 Agent 默认需要批准</text>
    <text x="38" y="846" font-size="24" fill="#5d5d5d">
      显示名 ≠ 房主凭证 · 房间目录 ≠ 文件系统沙箱
    </text>
  </g>
</svg>
