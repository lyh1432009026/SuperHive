<svg
  xmlns="http://www.w3.org/2000/svg"
  width="760"
  height="810"
  viewBox="0 0 760 810"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">飞书与微信消息通道示意</title>
  <desc id="desc">
    手机发出文字，Hive 核对房间和接收 Agent，由 Agent 所在电脑执行，结果记录回到 Hive
    再推送给本人。飞书支持卡片和附件，微信当前只有文字且存在账号风险。示意图不是实际界面截图。
  </desc>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="8"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5d5d5d" />
    </marker>
  </defs>
  <rect width="760" height="810" rx="24" fill="#f9f9f9" />
  <g
    font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"
    fill="#0d0d0d"
  >
    <text x="38" y="58" font-size="32" font-weight="700">手机发消息，Agent 电脑执行</text>
    <text x="38" y="98" font-size="24" fill="#5d5d5d">原创通道示意 · 非实际界面截图</text>
    <rect
      x="38"
      y="128"
      width="684"
      height="110"
      rx="16"
      fill="#e6f0fa"
      stroke="#93bde5"
      stroke-width="2"
    />
    <text x="380" y="169" font-size="28" font-weight="700" text-anchor="middle">
      手机：飞书或个人微信
    </text>
    <text x="380" y="213" font-size="25" text-anchor="middle">
      先核对 /room，再用 /to 或 @ 选对象
    </text>
    <path
      d="M 380 248 V 278"
      fill="none"
      stroke="#5d5d5d"
      stroke-width="3"
      marker-end="url(#arrow)"
    />
    <rect
      x="38"
      y="292"
      width="684"
      height="110"
      rx="16"
      fill="#ffffff"
      stroke="#e8e8e8"
      stroke-width="2"
    />
    <text x="380" y="333" font-size="28" font-weight="700" text-anchor="middle">
      Hive Server：房间与任务路由
    </text>
    <text x="380" y="377" font-size="25" text-anchor="middle">
      保存消息、状态；校验可用操作与身份
    </text>
    <path
      d="M 380 412 V 442"
      fill="none"
      stroke="#5d5d5d"
      stroke-width="3"
      marker-end="url(#arrow)"
    />
    <rect
      x="38"
      y="456"
      width="684"
      height="110"
      rx="16"
      fill="#e8f5ef"
      stroke="#94c5b1"
      stroke-width="2"
    />
    <text x="380" y="497" font-size="28" font-weight="700" text-anchor="middle">
      Agent 所在电脑：Runtime 处理任务
    </text>
    <text x="380" y="541" font-size="25" text-anchor="middle">
      不是在手机上运行，也不自动扩大权限
    </text>
    <path
      d="M 380 576 V 606"
      fill="none"
      stroke="#5d5d5d"
      stroke-width="3"
      marker-end="url(#arrow)"
    />
    <rect
      x="38"
      y="620"
      width="684"
      height="110"
      rx="16"
      fill="#ffffff"
      stroke="#e8e8e8"
      stroke-width="2"
    />
    <text x="380" y="661" font-size="28" font-weight="700" text-anchor="middle">
      任务记录回 Hive → 推送给本人
    </text>
    <text x="380" y="705" font-size="25" text-anchor="middle">
      飞书：卡片 / 附件 · 微信：当前仅文字
    </text>
    <text x="38" y="778" font-size="24" fill="#86591d">
      微信需确认账号风险；消息会经过对应 IM 平台。
    </text>
  </g>
</svg>
